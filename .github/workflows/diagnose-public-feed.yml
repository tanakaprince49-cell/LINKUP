name: Diagnose public member feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-logs:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Link the existing Vercel project
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Sample the live member feed
        shell: bash
        run: |
          for attempt in 1 2 3; do
            STATUS=$(curl -sS -o /tmp/linkup-members-$attempt -w '%{http_code}' --max-time 35 \
              'https://linkup-muqu.vercel.app/api/publicSeo?mode=members' || true)
            echo "Member feed attempt $attempt: $STATUS"
            sleep 2
          done
      - name: Read recent production runtime errors
        run: npx vercel@latest logs runtime --environment production --query 'level:error' --since 60m --token="$VERCEL_TOKEN"
