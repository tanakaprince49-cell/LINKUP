# Autonomous GitHub Commit Watcher for Linky Codebase Manager & Passive GitHub League.
#
# Automatically detects and records new commits pushed by connected builders
# even when they are offline / never opened LINKUP that day, using GitHub ETag
# conditional requests + built-in GITHUB_TOKEN and Firebase Admin SDK.
name: Linky Autonomous GitHub Commit Watcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      write:
        description: 'Record newly discovered commits to Firestore & Builder League.'
        type: boolean
        default: true

concurrency:
  group: linky-github-commit-watcher
  cancel-in-progress: false

jobs:
  watch-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Write the service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/linkup-sa.json"

      - name: Sweep connected GitHub repos & handles for new commits
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/linkup-sa.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node github-commit-watcher.mjs
          ${{ (github.event_name == 'schedule' || inputs.write != false) && '--write' || '' }}
          --discover

      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/linkup-sa.json"
