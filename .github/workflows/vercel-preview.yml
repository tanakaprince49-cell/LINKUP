name: Deploy Vercel Preview (Feature Branch)

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: linkup-vercel-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Deploy Isolated Vercel Preview (Non-Production)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install root and mobile dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund

      - name: Run full test suite & TypeScript check
        run: |
          node --test tests/*.mjs
          npm --prefix mobile run typecheck

      - name: Sync preview secrets to Vercel preview environment
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          ZEN_MODEL: ${{ secrets.ZEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        shell: bash
        run: |
          sync_preview() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              npx vercel@latest env add "$name" preview --value="$value" --force --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            fi
          }
          sync_preview FIREBASE_SERVICE_ACCOUNT "$FIREBASE_SERVICE_ACCOUNT"
          sync_preview SERPAPI_KEY "$SERPAPI_KEY"
          sync_preview ZEN_API_KEY "$ZEN_API_KEY"
          sync_preview ZEN_MODEL "$ZEN_MODEL"
          sync_preview GEMINI_API_KEY "$GEMINI_API_KEY"
          sync_preview GEMINI_MODEL "$GEMINI_MODEL"

      - name: Pull Vercel preview environment & build preview output
        run: |
          npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy isolated Preview URL (NEVER touches production)
        id: deploy
        run: |
          PREVIEW_URL=$(npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)
          echo "PREVIEW_URL=$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Isolated Feature Preview Ready"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Preview App URL:** ${PREVIEW_URL}/app"
            echo "- **Preview LvlUp Venture Bridge:** ${PREVIEW_URL}/app/lvlup"
            echo "- **Production (\`www.linkupbuild.com\`):** Untouched"
          } >> "$GITHUB_STEP_SUMMARY"
