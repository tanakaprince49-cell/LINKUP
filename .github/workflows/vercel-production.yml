name: Deploy Expo Web to Vercel Production

on:
  push:
    branches:
      - codex/mobile-port
  workflow_dispatch:

concurrency:
  group: linkup-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy existing Vercel project
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify Vercel secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub repo Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync server secrets to Vercel (only the ones set in GitHub)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          ZEN_MODEL: ${{ secrets.ZEN_MODEL }}
        shell: bash
        run: |
          # the fallback brain and the search key live in Vercel, not the repo, so
          # they travel as GitHub secrets and are pushed before the build pulls env
          sync() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              npx vercel@latest env add "$name" production --value="$value" --force --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 \
                && echo "$name synced" \
                || echo "$name already set to this value (or env add refused it) - continuing"
            else
              echo "$name not set in GitHub secrets - skipping"
            fi
          }
          sync SERPAPI_KEY "$SERPAPI_KEY"
          sync ZEN_API_KEY "$ZEN_API_KEY"
          sync ZEN_MODEL "$ZEN_MODEL"

      - name: Pull Vercel production environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Promote to production
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
